<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7A4B">
<title>STEP League — Play</title>
<style>
:root{--g:#0A7A4B;--g2:#0B3D2B;--o:#F08A24;--gold:#FFC93C;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#073d27;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 28px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top img{width:44px;height:44px;border-radius:12px}
.top .t{font-weight:800;font-size:20px}.top .s{font-size:13px;opacity:.8}
.card{background:#fff;color:#0E1A14;border-radius:20px;padding:20px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;font-size:18px;padding:12px 14px;border:2px solid #cfdcd5;border-radius:12px;font-family:inherit}
.cls{display:flex;gap:10px}.cls button{flex:1;font-size:22px;font-weight:800;padding:14px;border-radius:14px;border:3px solid #cfdcd5;background:#f4f8f6;color:var(--g2);font-family:inherit}
.cls button.on{border-color:var(--g);background:#e3f5ec}
.cls.mode button{font-size:18px;padding:10px}.cls.mode button:disabled{opacity:.35}
.fcls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.fcls button{font-size:17px;font-weight:800;padding:9px 0;border-radius:10px;border:3px solid #cfdcd5;background:#f4f8f6;color:var(--g2);font-family:inherit}
.fcls button.on{border-color:var(--g);background:#e3f5ec}
.gold{display:inline-block;background:linear-gradient(90deg,#ffe27a,#ffb300);color:#3a2600;border-radius:20px;padding:2px 12px;font-weight:800;font-size:13px}
.names{display:grid;gap:8px}.nmb{font-size:19px;font-weight:700;padding:12px 14px;border-radius:12px;border:3px solid #cfdcd5;background:#f4f8f6;color:#0B3D2B;text-align:left;font-family:inherit}
.nmb.on{border-color:var(--g);background:#e3f5ec}.nmb:disabled{opacity:.45}
.link{margin-top:10px;background:none;border:0;color:#0A7A4B;text-decoration:underline;font-size:15px;font-family:inherit;padding:4px 0}
#nm{margin-top:8px}.nmb[dir=auto]{text-align:start}
.btn{width:100%;margin-top:18px;font-size:20px;font-weight:800;padding:15px;border:0;border-radius:14px;background:var(--g);color:#fff;font-family:inherit}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{font-size:28px;line-height:1;padding:8px 0;border-radius:12px;border:3px solid #cfdcd5;background:#f4f8f6;font-family:inherit}
.avs button.on{border-color:var(--o);background:#fff3e0;transform:scale(1.08)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.big{font-size:30px;font-weight:800}
.muted{opacity:.8}
.me{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.me .pts{color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums}
.q{direction:ltr;text-align:left;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:14px 16px;font-size:19px;line-height:1.5;margin-bottom:14px;white-space:pre-line}
.qh{font-size:14px;opacity:.85;margin-bottom:8px;display:flex;justify-content:space-between}
.opts{display:grid;gap:12px;direction:ltr}
:root{color-scheme:only light}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.q u{text-decoration-thickness:2px;text-underline-offset:4px;color:#FFE27A;font-weight:700}
.q .bl{display:inline-block;width:56px;border-bottom:2px solid #fff;margin:0 4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;text-align:left;background:#fff;color:#0E1A14;-webkit-text-fill-color:#0E1A14;-webkit-appearance:none;appearance:none;border:4px solid transparent;border-radius:16px;padding:14px;font-size:19px;font-weight:600;font-family:inherit}
.opt b{-webkit-text-fill-color:#fff;flex:0 0 40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.opt.sel{border-color:var(--gold);background:#fff8e1}
.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.no{border-color:var(--bad);background:#fee2e2}
.opts.locked .opt:not(.sel):not(.ok){opacity:.45}
.res{font-size:40px;font-weight:900}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.png" alt=""><div><div class="t">STEP League</div><div class="s" id="sub">STEP League</div></div></div>

  <section id="join" hidden>
    <div class="card">
      <div style="font-weight:800;font-size:20px;color:#0B3D2B" id="mtitle"></div>
      <div id="gate" style="font-size:14px;color:#0A7A4B;font-weight:700;margin-top:8px"></div>
      <div class="cls mode" id="mode" style="margin-top:8px"><button type="button" data-m="p" class="on">⚽ Player</button><button type="button" data-m="f">👥 Fan</button></div>
      <div id="pbox">
        <label>Your class</label>
        <div class="cls" id="cls"></div>
        <div id="namebox" hidden>
          <label>Your name</label>
          <div class="names" id="names"></div>
          <input id="nm" maxlength="24" autocomplete="off" placeholder="Write your name" hidden>
          <button type="button" class="link" id="other" hidden>My name is not on the list</button>
          <div id="codebox" hidden><label>Your code (on your card)</label><input id="pcode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 digits" style="letter-spacing:8px;font-size:24px;text-align:center"></div>
        </div>
      </div>
      <div id="fbox" hidden>
        <div style="font-size:14px;color:#3d5a4b;margin-top:10px">Watching in the hall? Answer for fun. Your answers do not change the match score.</div>
        <label>Your class</label>
        <div class="fcls" id="fcls"></div>
        <div id="fnamebox" hidden><label>Your name</label><div class="names" id="fnames"></div></div>
        <div id="fanon" hidden style="font-size:14px;color:#3d5a4b;margin-top:10px">Your class list is not added yet: you will join as «Fan» with your avatar.</div>
      </div>
      <div id="avbox" hidden>
        <label>Choose your avatar</label>
        <div class="avs" id="avs"></div>
      </div>
      <div class="err" id="jerr"></div>
      <button class="btn" id="jbtn">Join the match</button>
    </div>
  </section>

  <section id="nogame" class="center" hidden><div class="big">No open match</div><div class="muted">Scan the code on the screen again.</div></section>

  <section id="game" hidden style="flex:1;display:flex;flex-direction:column">
    <div class="me"><span id="mename"></span><span class="pts" id="mepts">0</span></div>
    <div id="gview" style="flex:1;display:flex;flex-direction:column"></div>
    <div id="diag" style="margin-top:16px;text-align:center;font-size:13px;opacity:.75;direction:ltr"></div>
  </section>
</div>
<script>
const DB = 'https://step-league-school-default-rtdb.europe-west1.firebasedatabase.app';
const room = new URLSearchParams(location.search).get('r') || '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const L = ['A', 'B', 'C', 'D'];
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const url = (p) => `${DB}/rooms/${encodeURIComponent(room)}/${p}.json`;
// every request has a time limit: a stalled connection on a school network must never hang the page
function fx(u, opt = {}, ms = 6000) { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(u, { ...opt, cache: 'no-store', signal: c.signal }).finally(() => clearTimeout(t)); }
let me = ls.get('sl_me_' + room); // {id,name,cls}
const MAXP = 5; // players per class (the screen scores the best 5 anyway)
let state = null, picked = ls.get('sl_picked_' + room) || {}, scores = {}; // kept on the phone: a reopened page cannot answer twice

async function boot() {
  if (!room) return show('nogame');
  let info = null; // retry: a weak school network can drop the first request
  for (let i = 0; i < 6 && !info; i++) { info = await fx(url('info'), {}, 5000).then((r) => r.json()).catch(() => null); if (!info) await new Promise((r) => setTimeout(r, 1500)); }
  if (!info) return show('nogame');
  $('#sub').textContent = info.title || '';
  if (me) return enter();
  $('#mtitle').textContent = info.title || '';
  let cls = null, pickedName = null, typing = false, taken = [], entries = [];
  // the code is checked on the phone against a slow hash (the database never holds the codes themselves)
  const codeOk = async (key, n, code, h) => {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(`steplg|${key}|${n}`), iterations: 100000 }, k, 128);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, '0')).join('') === h;
  };
  // avatar instead of a photo (no pictures of students online); a random one is preselected
  const AV = ['🦅', '🦁', '🐺', '🐯', '🦈', '🐉', '🦊', '🐻', '🐆', '🦂', '🐎', '🐍', '⚽', '🏀', '🏆', '⚡', '🔥', '🚀', '💎', '👑', '🎯', '🛡️', '⭐', '🌪️'];
  let av = AV[Math.floor(Math.random() * AV.length)];
  $('#avs').innerHTML = AV.map((x) => `<button type="button" class="${x === av ? 'on' : ''}">${x}</button>`).join('');
  $('#avs').querySelectorAll('button').forEach((b) => b.onclick = () => { av = b.textContent; $('#avs').querySelectorAll('button').forEach((y) => y.classList.toggle('on', y === b)); });
  const norm = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  const typeMode = () => { typing = true; pickedName = null; $('#names').querySelectorAll('button').forEach((x) => x.classList.remove('on')); $('#nm').hidden = false; $('#nm').focus(); };
  $('#other').onclick = typeMode;
  $('#cls').innerHTML = info.teams.map((t, i) => `<button type="button" data-i="${i}">${esc(t)}</button>`).join('');
  $('#cls').querySelectorAll('button').forEach((b) => b.onclick = async () => {
    cls = +b.dataset.i; pickedName = null; typing = false; $('#jerr').textContent = 'Loading names…'; // a slow network can take a few seconds
    $('#cls').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    const key = String(info.teams[cls]).replace('/', '-');
    // any student of the class may play (absences happen); the name comes from the full class list, at most 5 per class
    const [roster, players] = await Promise.all([
      fx(`${DB}/rooms/fanlist/${encodeURIComponent(key)}.json`).then((r) => r.json()).catch(() => null),
      fx(url('players')).then((r) => r.json()).catch(() => null),
    ]);
    taken = Object.values(players || {}).filter((p) => p.c === cls).map((p) => norm(p.n));
    if (taken.length >= MAXP) { $('#namebox').hidden = true; $('#avbox').hidden = true; $('#jerr').textContent = `Class ${info.teams[cls]} already has ${MAXP} players. Join as a fan when the teacher opens it.`; return; }
    entries = Array.isArray(roster) ? roster.filter(Boolean).map((x) => (typeof x === 'string' ? { n: x } : x)) : [];
    const list = entries.map((x) => x.n);
    $('#codebox').hidden = !entries.some((x) => x.h); $('#pcode').value = '';
    $('#codebox label').textContent = entries.some((x) => x.t === 'id') ? 'Last 4 digits of your ID number' : 'Your code (on your card)';
    $('#namebox').hidden = false; $('#avbox').hidden = false; $('#jerr').textContent = '';
    $('#names').innerHTML = list.map((n) => `<button type="button" dir="auto" class="nmb" ${taken.includes(norm(n)) ? 'disabled' : ''}>${esc(n)}${taken.includes(norm(n)) ? ' ✔' : ''}</button>`).join('');
    $('#names').querySelectorAll('button:not([disabled])').forEach((x) => x.onclick = () => { pickedName = x.textContent; typing = false; $('#nm').hidden = true; $('#names').querySelectorAll('button').forEach((y) => y.classList.toggle('on', y === x)); $('#jerr').textContent = ''; });
    $('#other').hidden = true; // once the class list is in, nobody types a name (no rude names on the big screen)
    $('#nm').hidden = !!list.length; if (!list.length) typing = true;
  });
  $('#nm').oninput = () => { $('#jerr').textContent = ''; };
  let fan = false, fcls = null, fname = null, fanList = [];
  // fans pick their class and their name from the class list (no typed names on the big screen)
  const ALL = ["1/1","1/2","1/3","1/4","2/1","2/2","2/3","2/4","2/5","3/1","3/2","3/3","3/4","3/5","3/6"];
  $('#fcls').innerHTML = ALL.map((c) => `<button type="button">${esc(c)}</button>`).join('');
  $('#fcls').querySelectorAll('button').forEach((b) => b.onclick = async () => {
    fcls = b.textContent; fname = null; $('#fcls').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    $('#jerr').textContent = 'Loading names…';
    const list = await fx(`${DB}/rooms/fanlist/${encodeURIComponent(fcls.replace('/', '-'))}.json`).then((r) => r.json()).catch(() => null);
    fanList = Array.isArray(list) ? list.filter(Boolean).map((x) => (typeof x === 'string' ? x : x.n)) : []; $('#jerr').textContent = '';
    $('#fnamebox').hidden = !fanList.length; $('#fanon').hidden = !!fanList.length;
    $('#fnames').innerHTML = fanList.map((n) => `<button type="button" dir="auto" class="nmb">${esc(n)}</button>`).join('');
    $('#fnames').querySelectorAll('button').forEach((x) => x.onclick = () => { fname = x.textContent; $('#fnames').querySelectorAll('button').forEach((y) => y.classList.toggle('on', y === x)); $('#jerr').textContent = ''; });
  });
  $('#mode').querySelectorAll('button').forEach((b) => b.onclick = () => {
    fan = b.dataset.m === 'f'; $('#mode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    $('#pbox').hidden = fan; $('#fbox').hidden = !fan; $('#avbox').hidden = !fan && cls == null; $('#jerr').textContent = '';
    $('#jbtn').textContent = fan ? 'Join as a fan' : 'Join the match';
  });
  // the teacher opens the doors in two steps: players first, then fans (F on the screen)
  let gate = info.gate || 'players';
  const applyGate = () => {
    const pb = $('#mode button[data-m="p"]'), fb = $('#mode button[data-m="f"]');
    pb.disabled = fb.disabled = false;
    if ((gate === 'fans') !== fan) (gate === 'fans' ? fb : pb).click();
    pb.disabled = gate === 'fans'; fb.disabled = gate !== 'fans';
    $('#gate').textContent = gate === 'fans' ? 'Players are closed. Join as a fan.' : 'Players join now. Fans can join after the teacher opens it.';
  };
  applyGate();
  const gatePoll = setInterval(async () => { if ($('#join').hidden) return clearInterval(gatePoll); const i = await fx(url('info'), {}, 5000).then((r) => r.json()).catch(() => null); if (i && (i.gate || 'players') !== gate) { gate = i.gate || 'players'; applyGate(); } }, 3000);
  $('#jbtn').onclick = async () => {
    const i = await fx(url('info'), {}, 5000).then((r) => r.json()).catch(() => null);
    if (i && (i.gate || 'players') !== gate) { gate = i.gate || 'players'; applyGate(); $('#jerr').textContent = gate === 'fans' ? 'Players are closed now.' : 'Fans can not join yet.'; return; }
    if (fan) {
      if (!fcls) { $('#jerr').textContent = 'Choose your class.'; return; }
      if (fanList.length && !fname) { $('#jerr').textContent = 'Tap your name.'; return; }
      const name = fanList.length ? fname : `Fan ${fcls}`;
      const id = 'f' + Math.random().toString(36).slice(2, 10);
      $('#jbtn').disabled = true; let ok = false;
      for (let n = 0; n < 3 && !ok; n++) { ok = await fx(url('fans/' + id), { method: 'PUT', body: JSON.stringify({ n: name, a: av }) }).then((r) => r.ok).catch(() => false); if (!ok) await new Promise((r) => setTimeout(r, 800)); }
      $('#jbtn').disabled = false;
      if (!ok) { $('#jerr').textContent = 'Could not join. Check the internet and try again.'; return; }
      me = { id, name, fan: true, av }; ls.set('sl_me_' + room, me); return enter();
    }
    if (cls == null) { $('#jerr').textContent = 'Choose your class.'; return; }
    const name = (typing ? $('#nm').value : pickedName || '').trim();
    if (!name) { $('#jerr').textContent = typing ? 'Write your name first.' : 'Tap your name.'; return; }
    if (taken.includes(norm(name))) { $('#jerr').textContent = 'This name has already joined. If this is your name, tell the teacher.'; return; }
    const ent = entries.find((x) => x.n === name);
    if (ent && ent.h) {
      const code = $('#pcode').value.trim();
      if (!/^\d{4}$/.test(code)) { $('#jerr').textContent = ent.t === 'id' ? 'Write the last 4 digits of your ID number.' : 'Write the 4-digit code from your card.'; return; }
      $('#jerr').textContent = 'Checking…';
      if (!(await codeOk(String(info.teams[cls]).replace('/', '-'), name, code, ent.h).catch(() => false))) { $('#jerr').textContent = ent.t === 'id' ? 'Wrong digits. Check the last 4 digits of your ID.' : 'Wrong code.'; return; }
      $('#jerr').textContent = '';
    }
    const now = await fx(url('players')).then((r) => r.json()).catch(() => null);
    if (Object.values(now || {}).filter((p) => p.c === cls).length >= MAXP) { $('#jerr').textContent = `Class ${info.teams[cls]} already has ${MAXP} players.`; return; }
    const id = 'p' + Math.random().toString(36).slice(2, 10);
    me = { id, name, cls, av };
    $('#jbtn').disabled = true;
    let ok = false;
    for (let n = 0; n < 3 && !ok; n++) { ok = await fx(url('players/' + id), { method: 'PUT', body: JSON.stringify({ n: name, c: cls, a: av, t: { '.sv': 'timestamp' } }) }).then((r) => r.ok).catch(() => false); if (!ok) await new Promise((r) => setTimeout(r, 800)); }
    $('#jbtn').disabled = false;
    if (!ok) { $('#jerr').textContent = 'Could not join. Check the internet and try again.'; return; }
    ls.set('sl_me_' + room, me);
    enter();
  };
  show('join');
}
function show(id) { ['join', 'nogame', 'game'].forEach((s) => $('#' + s).hidden = s !== id); }

function enter() {
  show('game');
  // the page was closed while a question was on screen and not answered → that question is cancelled
  const open = ls.get('sl_open_' + room);
  if (!me.fan && open && picked[open] == null) markAway(open);
  if (!me.fan) Object.keys(away).forEach(sendAway);
  $('#mename').textContent = (me.fan ? '👥 ' : '') + (me.av ? me.av + ' ' : '') + me.name;
  listen('state', (v) => { state = v; if (me.fan) fanCount(); try { render(); jsErr = ''; } catch (e) { jsErr = String(e.message || e); } });
  // the teacher removed this player from the lobby (wrong name) → back to the join form
  if (!me.fan) listen('players/' + me.id, (v) => { if (v === null) { try { localStorage.removeItem('sl_me_' + room); } catch (e) {} alert('The teacher removed you from the match. Join again with YOUR name.'); location.reload(); } });
  if (me.fan) $('#mepts').textContent = (ls.get('sl_fanok_' + room) || []).length + ' ✔';
  else listen('scores/' + me.id, (v) => { $('#mepts').textContent = v || 0; });
  // status line: lets the teacher see at a glance whether a phone is still receiving the match
  setInterval(() => {
    const age = okAt ? Math.round((Date.now() - okAt) / 1000) : 99, d = $('#diag');
    d.innerHTML = `Match ${esc(room)} · ${age <= 6 ? '<span style="color:#4ade80">connected ✔</span>' : `<span style="color:#f87171">no connection (${age}s)</span>`}${jsErr ? ' · error: ' + esc(jsErr) : ''}${age > 6 && netErr ? ' · ' + esc(netErr) : ''}${age > 12 ? ' <button onclick="location.reload()" style="font-size:16px;padding:6px 14px;border-radius:10px;border:0;margin-inline-start:6px">Reload</button>' : ''}`;
  }, 1000);
}
let okAt = 0, netErr = '', jsErr = '';
const seenSent = {};
// short reads every 1.2 s with a time limit (no long-held live connections: browsers allow only a few per site,
// and a stuck one left phones on «You are in»); the callback runs only when the value changed
function listen(path, cb) {
  let last, busy = false;
  const poll = async () => {
    if (busy) return; busy = true;
    try { const r = await fx(url(path), {}, 5000); if (!r.ok) throw new Error('HTTP ' + r.status); const v = await r.json(); okAt = Date.now(); netErr = ''; const s = JSON.stringify(v); if (s !== last) { last = s; cb(v); } }
    catch (e) { netErr = e.name === 'AbortError' ? 'slow network' : String(e.message || e); }
    busy = false;
  };
  setInterval(poll, 1200); poll();
}

// same as the big screen: underline the options inside the sentence (error questions) and draw the blank as a line
function stem(q) {
  let s = esc(q.p);
  if (q.u) for (const op of q.o) { const e = esc(op).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); s = s.replace(new RegExp(`(^|[^A-Za-z’'])(${e})(?![A-Za-z])`, 'i'), '$1<u>$2</u>'); }
  return s.replace(/(?:…|[.…]{2,})(?:\s*[.…]+)*/g, '<span class="bl"></span>');
}

// anti-cheat: leaving the page (another app, an AI assistant, a screenshot search…) while a question is open cancels that question
// The marks are kept on the phone too: closing the tab can kill the request before it leaves, so it is sent again
// when the page comes back (and a page reopened while a question it showed was still unanswered counts as leaving).
const away = ls.get('sl_away_' + room) || {}, awaySent = {};
function sendAway(k) {
  if (awaySent[k] || !me) return;
  fx(url(`away/${k}/${me.id}`), { method: 'PUT', body: '1', keepalive: true }).then((r) => { if (r.ok) awaySent[k] = 1; }).catch(() => {});
}
function markAway(k) { away[k] = 1; ls.set('sl_away_' + room, away); sendAway(k); }
// a fan's own tally of correct answers (kept on the phone)
function fanCount() {
  if (!state || state.phase !== 'reveal' || picked[state.k] !== state.ans) return;
  const ok = ls.get('sl_fanok_' + room) || []; if (!ok.includes(state.k)) { ok.push(state.k); ls.set('sl_fanok_' + room, ok); }
  $('#mepts').textContent = ok.length + ' ✔';
}
function leftPage() {
  if (!me || me.fan || !state || state.phase !== 'q' || picked[state.k] != null || away[state.k]) return;
  markAway(state.k);
  render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) leftPage(); else if (me && !me.fan) Object.keys(away).forEach(sendAway); });
addEventListener('pagehide', leftPage);
addEventListener('blur', leftPage);
document.addEventListener('copy', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

let tick = null;
function render() {
  const v = $('#gview');
  clearInterval(tick);
  if (!state || state.phase === 'lobby') { v.innerHTML = `<div class="center"><div class="big">You are in ✔</div><div class="muted">Wait for the teacher to start…</div></div>`; return; }
  if (state.phase === 'round') { v.innerHTML = `<div class="center"><div class="muted">Round</div><div class="big">${esc(state.round || '')}</div><div class="muted">${esc(state.rule || '')}</div></div>`; return; }
  if (state.phase === 'end') { v.innerHTML = `<div class="center"><div class="big">Full time!</div><div class="muted">${me.fan ? 'Your correct answers' : 'Your points'}</div><div class="res" style="color:var(--gold)">${$('#mepts').textContent}</div><div class="muted">${esc(state.winner ? 'Winner: ' + state.winner : '')}</div></div>`; return; }
  if (state.phase === 'q' || state.phase === 'reveal') {
    const q = state.q, k = state.k, mine = picked[k];
    const reveal = state.phase === 'reveal';
    if (!me.fan) ls.set('sl_open_' + room, !reveal && mine == null && !away[k] ? k : null);
    if (away[k]) { v.innerHTML = `<div class="center"><div class="res" style="color:#fbbf24">⚠</div><div class="big" style="font-size:24px">You left the page</div><div class="muted">This question is cancelled for you. Stay on this page for the next one.</div></div>`; return; }
    let res = '';
    if (reveal) res = mine == null ? '<div class="center" style="flex:0;margin:14px 0"><div class="res">⏱️</div><div class="muted">No answer</div></div>' : mine === state.ans ? '<div class="center" style="flex:0;margin:14px 0"><div class="res" style="color:#4ade80">Correct ✔</div></div>' : '<div class="center" style="flex:0;margin:14px 0"><div class="res" style="color:#f87171">Wrong ✘</div></div>';
    // options first so they are on screen without scrolling; the question text (also on the big screen) goes under them
    v.innerHTML = `<div class="qh"><span>${esc(state.round || '')} · Question ${state.n} ${state.gold && !reveal ? '<span class="gold">⭐ ×2</span>' : ''}</span><span class="timer" id="tm"></span></div>
      <div class="opts ${mine != null || reveal ? 'locked' : ''}">${(q.o || []).map((o, i) => `<button class="opt ${mine === i ? 'sel' : ''} ${reveal && i === state.ans ? 'ok' : ''} ${reveal && mine === i && i !== state.ans ? 'no' : ''}" data-i="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>${res}
      ${q.p ? `<div class="q" style="margin-top:14px;font-size:17px">${stem(q)}</div>` : ''}
      ${!reveal && mine != null ? '<div class="center" style="flex:0;margin-top:16px"><div class="muted">Answer saved</div></div>' : ''}`;
    if (!reveal && mine == null) v.querySelectorAll('.opt').forEach((b) => b.onclick = () => answer(k, +b.dataset.i));
    // tell the teacher screen this phone has the question on screen
    if (!me.fan && !reveal && !seenSent[k] && v.querySelectorAll('.opt').length) { seenSent[k] = 1; fx(url(`seen/${k}/${me.id}`), { method: 'PUT', body: '1' }).catch(() => { delete seenSent[k]; }); }
    if (!reveal && state.dl) { const upd = () => { const s = Math.max(0, Math.ceil((state.dl - (Date.now() + (state.skew || 0))) / 1000)); const t = $('#tm'); if (t) t.textContent = s + 's'; }; upd(); tick = setInterval(upd, 500); }
  }
}
async function answer(k, i) {
  if (picked[k] != null || !state || state.phase !== 'q' || state.k !== k) return;
  picked[k] = i; ls.set('sl_picked_' + room, picked); render();
  let ok = false; // retry: a weak network can drop one request
  for (let n = 0; n < 3 && !ok; n++) { ok = await fx(url(`${me.fan ? 'fanans' : 'answers'}/${k}/${me.id}`), { method: 'PUT', body: JSON.stringify({ c: i, t: { '.sv': 'timestamp' } }) }).then((r) => r.ok).catch(() => false); if (!ok) await new Promise((r) => setTimeout(r, 700)); }
  if (!ok) { delete picked[k]; ls.set('sl_picked_' + room, picked); render(); alert('Your answer did not arrive. Try again.'); }
}
boot();
</script>
</body>
</html>
