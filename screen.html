<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>دوري ستيب — شاشة المباراة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--g:#0A7A4B;--g2:#0B3D2B;--o:#F08A24;--gold:#FFC93C;--led:#FFB300;--ink:#0E1A14;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050806;overflow:hidden;font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
[hidden]{display:none!important}
.en{font-family:'Inter','IBM Plex Sans Arabic',sans-serif}
#stage{direction:ltr;position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:center;background:radial-gradient(ellipse at 50% 120%,#0f6b43 0%,#073d27 55%,#04190f 100%);color:#fff;overflow:hidden}
#stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 80px,rgba(0,0,0,.03) 80px 160px);pointer-events:none}
#board{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;background:#0b0b0b;border:3px solid #2b2b2b;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:5}
.team{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 26px;min-width:180px}
.team .nm{font-size:24px;font-weight:700}.team .cnt{font-size:13px;color:#9fd7b9}
.team .sc{font-family:'Inter';font-size:58px;font-weight:800;color:var(--led);line-height:1;text-shadow:0 0 18px rgba(255,179,0,.55);font-variant-numeric:tabular-nums;transition:transform .25s}
.team .sc.bump{transform:scale(1.2)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 20px;border-inline:2px solid #222;min-width:190px}
.mid .rd{font-size:16px;color:#9fd7b9;font-weight:700}
.mid .clock{font-family:'Inter';font-size:42px;font-weight:800;color:#ff5a3c;text-shadow:0 0 14px rgba(255,90,60,.5);font-variant-numeric:tabular-nums}
.mid .clock.low{animation:blink .5s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
#tug{position:absolute;top:142px;left:50%;transform:translateX(-50%);width:760px;height:24px;z-index:4}
#tug .rope{position:absolute;top:10px;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,#c9975a 0 10px,#a8743b 10px 20px);border-radius:3px}
#tug .center{position:absolute;left:50%;top:0;width:2px;height:24px;background:rgba(255,255,255,.35)}
#tug .knot{position:absolute;top:1px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#e53935;border:3px solid #fff;transition:left .6s cubic-bezier(.3,1.6,.5,1);left:50%}
.logo-corner{position:absolute;right:24px;top:20px;width:80px;height:80px;z-index:5}
.mname{position:absolute;left:28px;top:26px;font-size:17px;color:#9fd7b9;z-index:5;line-height:1.5;font-family:Inter}
#view{position:absolute;inset:178px 50px 30px 50px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:80px;font-weight:700;line-height:1.15}.kicker{font-size:28px;color:#9fd7b9;font-weight:700}
.chip{display:inline-block;background:rgba(255,201,60,.15);border:2px solid var(--gold);color:var(--gold);border-radius:40px;padding:4px 22px;font-size:22px;font-weight:700}
/* lobby */
.lobby{display:grid;grid-template-columns:420px 1fr;gap:40px;width:100%;height:100%;align-items:center}
.qrbox{background:#fff;border-radius:24px;padding:22px;text-align:center;color:var(--ink)}
.qrbox img{width:340px;height:340px;image-rendering:pixelated}
.qrbox .u{font-family:'Inter';font-weight:700;font-size:20px;direction:ltr;margin-top:6px;color:var(--g2);word-break:break-all}
.cols{display:grid;gap:20px;height:100%;align-content:center}
.col{background:rgba(0,0,0,.22);border-radius:20px;padding:16px 20px}
.col h3{margin:0 0 10px;font-size:30px;display:flex;justify-content:space-between}
.pchip{cursor:pointer}.pchip.arm{background:#e53935!important;color:#fff!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}.pchip{background:#fff;color:var(--ink);border-radius:30px;padding:6px 16px;font-size:20px;font-weight:600;animation:pop .4s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
/* question */
.qwrap{display:flex;flex-direction:column;align-items:center;width:100%;height:100%}
.qno{font-size:20px;color:#9fd7b9;font-weight:700;margin-bottom:8px;display:flex;gap:14px;align-items:center}
.stem{direction:ltr;font-family:'Inter';font-size:36px;font-weight:600;line-height:1.35;max-width:1450px;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 34px;text-align:left;white-space:pre-line}
.stem.long{font-size:28px}
.stem u{text-decoration-color:var(--gold);text-decoration-thickness:4px;text-underline-offset:8px}
.stem .bl{display:inline-block;width:110px;border-bottom:4px solid #fff;margin:0 8px;transform:translateY(-6px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:18px;width:1450px;direction:ltr}
.opt{position:relative;display:flex;align-items:center;gap:16px;background:#fff;color:var(--ink);border-radius:16px;padding:12px 20px;font-family:'Inter';font-size:28px;font-weight:600;text-align:left;border:4px solid transparent;transition:all .35s}
.opt .l{flex:0 0 50px;height:50px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.opt .cnt{margin-left:auto;font-size:20px;color:#5d6b63;font-weight:700}
.opt .why{display:block;font-family:'Inter';font-size:17px;font-weight:600;color:#7f1d1d;margin-top:2px}
.opt.small{font-size:21px}
.reveal .opt{opacity:.5}
.reveal .opt.ok{opacity:1;background:#d8ffe8;border-color:var(--ok);box-shadow:0 0 30px rgba(34,197,94,.5)}
.reveal .opt.ok .l{background:#16a34a}
.ex{margin-top:14px;width:1450px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:12px 20px;font-size:22px;line-height:1.6;text-align:left;border-left:8px solid var(--ok)}
.ex b{color:var(--g)}
.fast{margin-top:10px;display:inline-block;background:linear-gradient(90deg,#ffd54a,#ffb300);color:#3a2600;border-radius:30px;padding:6px 22px;font-family:'Inter';font-size:22px;font-weight:700;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.fast span{font-size:16px;opacity:.75}.fast .fav{font-size:30px;opacity:1;vertical-align:-4px;margin-right:6px}
.tile .av{font-size:22px;line-height:1}.rav{font-size:40px;margin-right:12px;vertical-align:-6px}
#lead{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.4);z-index:30;background:#e53935;color:#fff;font-family:'Inter';font-size:64px;font-weight:800;padding:18px 48px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
#lead.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#stage.hurry:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:25;box-shadow:inset 0 0 120px 30px rgba(229,57,53,.75);animation:hurry 1s ease-in-out infinite}
@keyframes hurry{0%,100%{opacity:.25}50%{opacity:1}}
.goldchip{display:inline-block;background:linear-gradient(90deg,#ffe27a,#ffb300);color:#3a2600;border-radius:30px;padding:3px 18px;font-weight:800;font-family:Inter;animation:pop .5s cubic-bezier(.3,1.6,.5,1),glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px rgba(255,201,60,.9)}}
.stem.gold{border-color:#ffc93c;box-shadow:0 0 34px rgba(255,201,60,.45)}
.vs{display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;width:100%;gap:20px}
.vs .side{background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;animation:slideL .7s ease-out both}
.vs .side.r{animation-name:slideR}
.vs .cn{font-family:Inter;font-size:96px;font-weight:800;color:var(--gold);line-height:1}
.vs .avs{font-size:46px;margin-top:14px;line-height:1.3;word-break:break-all}
.vs .x{font-family:Inter;font-size:110px;font-weight:900;color:#ff5a3c;text-shadow:0 0 30px rgba(255,90,60,.6);animation:pop .8s .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slideL{from{transform:translateX(-120%);opacity:0}}@keyframes slideR{from{transform:translateX(120%);opacity:0}}
.mvp .bigav{font-size:170px;line-height:1;animation:pop .9s cubic-bezier(.3,1.6,.5,1) both}
.mvp .nm{font-size:76px;font-weight:800;margin-top:6px}.mvp .pt{font-family:Inter;font-size:40px;color:var(--gold);font-weight:800}
.fanbar{margin-top:10px;display:inline-block;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:30px;padding:5px 20px;font-size:20px;font-weight:700;font-family:Inter}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;max-width:1500px}
.tile{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:5px 12px;font-size:18px;font-weight:600}
.tile .tm{font-family:'Inter';font-size:13px;color:#9fd7b9;border:1px solid #2d5c47;border-radius:6px;padding:0 5px}
.tile.ans{border-color:var(--gold)}.tile.ok{background:#14532d;border-color:var(--ok)}.tile.no{background:#4c1010;border-color:var(--bad)}.tile.away{background:#5a3a00;border-color:#f59e0b;color:#fde68a}
.tile .p{font-family:'Inter';color:var(--gold);font-weight:800}
.pwrap{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;width:100%;height:100%;direction:ltr;min-height:0}
.ptext{background:#fdfdf8;color:#1b1b1b;border-radius:16px;padding:16px 24px;font-family:'Inter';font-size:26px;line-height:1.42;text-align:left;overflow:hidden;min-height:0}
.ptext p{margin:0 0 10px}
.pq{display:flex;flex-direction:column;overflow:auto}
.pq .stem{font-size:26px;padding:14px 20px}.pq .opts{width:100%;grid-template-columns:1fr;gap:8px;margin-top:12px}
.pq{min-height:0}.pq .opt{font-size:20px;padding:8px 14px}.pq .opt .l{flex-basis:38px;height:38px;font-size:20px}.pq .ex{width:100%;font-size:18px}.pq .tiles{max-width:none}
/* round + ranking */
.rcard .n{font-family:'Inter';font-size:190px;font-weight:800;color:rgba(255,255,255,.08);line-height:.8}
.rcard .t{font-size:84px;font-weight:700;margin-top:-56px}.rcard .r{font-size:28px;color:#cfeedd;margin-top:14px;max-width:1100px;line-height:1.6}
.rank{display:grid;gap:10px;width:900px;margin-top:20px}
.rk{display:flex;align-items:center;gap:16px;background:rgba(0,0,0,.25);border-radius:14px;padding:8px 18px;font-size:26px;font-weight:700;animation:pop .4s backwards}
.rk .pos{font-family:'Inter';color:var(--gold);width:40px}.rk .cl{font-family:'Inter';color:#9fd7b9;font-size:20px}.rk .pt{margin-right:auto;font-family:'Inter';color:var(--led)}
/* setup */
#setup{direction:rtl;position:absolute;inset:0;background:#06140d;display:flex;align-items:center;justify-content:center;z-index:20}
#setup .card{background:#fff;color:var(--ink);border-radius:22px;padding:30px 40px;width:880px}
#setup h1{margin:0;color:var(--g2);font-size:38px}
#setup label{display:block;font-weight:700;margin:14px 0 6px;font-size:19px}
#setup select{width:100%;font:500 21px 'IBM Plex Sans Arabic';padding:10px 14px;border:2px solid #cfdcd5;border-radius:12px}
#setup .row{display:flex;gap:16px}#setup .row>div{flex:1}
#setup button{margin-top:22px;width:100%;font:700 24px 'IBM Plex Sans Arabic';background:var(--g);color:#fff;border:0;border-radius:14px;padding:14px;cursor:pointer}
#setup button.sec{background:#eef4f0;color:var(--g2);font-size:19px;margin-top:10px}
#setup .err{color:#c62828;font-size:16px;min-height:22px;margin-top:6px}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:6}
.cup{width:220px;height:220px;filter:drop-shadow(0 10px 40px rgba(255,201,60,.6));animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-14px)}}
#black{position:absolute;inset:0;background:#000;z-index:30}
#net{position:absolute;bottom:8px;left:12px;font-size:13px;color:#f87171;z-index:7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <img class="logo-corner" src="logo.png" alt="">
  <div class="mname" id="mname"></div>
  <div id="board" hidden></div>
  <div id="tug" hidden><div class="rope"></div><div class="center"></div><div class="knot" id="knot"></div></div>
  <div id="view"></div>
  <canvas id="confetti" width="1600" height="900"></canvas>
  <div id="net"></div>
  <div id="lead"></div>
  <div id="setup"><div class="card" id="lock">
    <div style="display:flex;align-items:center;gap:16px"><img src="logo.png" style="width:76px;height:76px" alt=""><div><h1>دوري ستيب</h1><div style="color:#5d6b63;font-size:17px">شاشة المعلم: اكتب كلمة سر الدوري</div></div></div>
    <label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="off" style="width:100%;font:500 22px 'Inter';padding:10px 14px;border:2px solid #cfdcd5;border-radius:12px;direction:ltr">
    <div class="err" id="perr"></div>
    <button id="unl">دخول</button>
  </div><div class="card" id="setcard" hidden>
    <div style="display:flex;align-items:center;gap:16px"><img src="logo.png" style="width:76px;height:76px" alt=""><div><h1>دوري ستيب</h1><div style="color:#5d6b63;font-size:17px">اختر المباراة والفصول، وبعدين الطلاب يمسحون الرمز</div></div></div>
    <label for="msel">المباراة</label><select id="msel"></select>
    <div class="row" id="trow"></div>
    <div class="err" id="err"></div>
    <button id="go">ابدأ مباراة رسمية (النتيجة تتسجل)</button>
    <button class="sec" id="try" style="margin-top:10px">مباراة تجريبية (النتيجة لا تتسجل)</button>
    <button class="sec" id="resume" hidden></button>
  </div></div>
  <div id="black" hidden></div>
</div>

// ---------- firebase REST ----------
const url = (p) => `${DB}/rooms/${encodeURIComponent(S.room)}${p ? '/' + p : ''}.json`;
// every request has a time limit: a stalled connection on a school network must never hang the match
function fx(u, opt = {}, ms = 6000) { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(u, { ...opt, cache: 'no-store', signal: c.signal }).finally(() => clearTimeout(t)); }
// writes retry 3 times: one dropped request must never leave the phones on an old step
async function put(p, v) {
  if (p === 'state') wantState = v;

    try { const r = await fx(url(p), { method: 'PUT', body: JSON.stringify(v) }); if (!r.ok) throw 0; $('#net').textContent = ''; return true; } catch (e) { $('#net').textContent = 'Connection problem…'; await new Promise((r) => setTimeout(r, 800)); }
  }

}
// safety net: every 3 s, if the database does not show the step on the screen, send it again
let wantState = null;
setInterval(() => {
  if (!S || !wantState || !$('#setup').hidden) return;
  const srv = stateSrv || {};
  if (srv.phase !== wantState.phase || srv.k !== wantState.k || srv.n !== wantState.n) {
    const v = wantState.phase === 'q' ? { ...wantState, st: (typeof srv.st === 'number' && srv.k === wantState.k) ? srv.st : { '.sv': 'timestamp' } } : wantState;
    fx(url('state'), { method: 'PUT', body: JSON.stringify(v) }).catch(() => {});
  }
}, 3000);
async function patch(p, v) {
  for (let i = 0; i < 3; i++) { try { const r = await fx(url(p), { method: 'PATCH', body: JSON.stringify(v) }); if (!r.ok) throw 0; return true; } catch (e) { $('#net').textContent = 'Connection problem…'; await new Promise((r) => setTimeout(r, 800)); } }
  return false;
}
// one short read of the whole room every 1.2 s (no long-held live connections: browsers allow only a few per site,
// and a stuck one froze matches); each registered path gets its part when it changed
const watchers = {}; let roomPoll = null, roomBusy = false, roomFails = 0;
function listen(path, cb) {
  watchers[path] = { cb, last: undefined };
  if (roomPoll) return;
  roomPoll = setInterval(async () => {
    if (!S || roomBusy) return; roomBusy = true;
    try {
      const r = await fx(url(''), {}, 5000); if (!r.ok) throw 0; const room = (await r.json()) || {};
      roomFails = 0; if ($('#net').textContent === 'Connection problem…') $('#net').textContent = '';
      for (const [p, w] of Object.entries(watchers)) { const v = room[p] == null ? {} : room[p], s = JSON.stringify(v); if (s !== w.last) { w.last = s; w.cb(v); } }
    } catch (e) { if (++roomFails >= 3) $('#net').textContent = 'Connection problem…'; }
    roomBusy = false;
  }, 1200);
}

async function getResults() { const out = {}; await Promise.all(DATA.matches.map(async (m) => { try { const r = await fx(`${DB}/rooms/res-${m.id}.json`); const v = await r.json(); if (v) out[m.id] = v; } catch (e) {} })); return out; }

// ---------- steps ----------
function build(m) {
  const b = m.bank, steps = [{ k: 'lobby' }, { k: 'intro' }];
  const R = [
    { t: 'Grammar', r: 'Answer on your phone. Correct answer = 100 points + up to 50 speed points. The last question of every round is GOLDEN: double points!', base: 100, bonus: 50, sec: 25, qs: b.r1 },
    { t: 'Written Expression', r: 'Find the mistake, or choose the best answer. Same points.', base: 100, bonus: 50, sec: 30, qs: b.r2 },
    { t: 'Reading', r: 'One passage, four questions. Correct answer = 200 points.', base: 200, bonus: 50, sec: 60, passage: b.r3.text, qs: b.r3.qs },
    { t: 'Speed', r: '10 seconds per question. Double points!', base: 200, bonus: 100, sec: 10, qs: b.r4 },
  ];
  // the last question of every round is golden: double points (a late chance to come back)
  R.filter((r) => r.qs.length).forEach((r, ri) => { steps.push({ k: 'round', ri, r }); r.qs.forEach((q, qi) => steps.push({ k: 'q', ri, r, q, qi, key: `r${ri}q${qi}`, gold: r.qs.length > 1 && qi === r.qs.length - 1 })); steps.push({ k: 'rank', ri, r }); });
  steps.push({ k: 'check' });
  const tr = { t: 'Tie-break', base: 200, bonus: 100, sec: 10, qs: b.tie };
  b.tie.forEach((q, qi) => steps.push({ k: 'q', ri: 9, r: tr, q, qi, key: `t${qi}`, tie: true }));
  steps.push({ k: 'mvp' }, { k: 'final' });
  return steps;
}

// fair class score for 5-player teams: fewer players (absence, no reserve) = average × 5; more than 5 (an extra joined) = best 5
const TEAM = 5;
function teamTotals() {
  const per = S.names.map(() => []);
  for (const [pid, p] of Object.entries(players)) if (p.c >= 0 && p.c < per.length) per[p.c].push(S.scores[pid] || 0);
  return per.map((l) => {
    if (!l.length) return 0;
    if (l.length >= TEAM) return l.sort((a, b) => b - a).slice(0, TEAM).reduce((a, b) => a + b, 0);
    return Math.round((l.reduce((a, b) => a + b, 0) * TEAM) / l.length);
  });

    v.innerHTML = `<div class="screen mvp"><div class="kicker">Player of the match</div>${p ? `<div class="bigav">${esc(p.a || '⭐')}</div><div class="nm">${esc(p.n)}</div><div class="pt">${esc(S.names[p.c] || '')} · ${top[1]} points</div>` : '<div class="big">—</div>'}

  } else if (st.k === 'rank' || st.k === 'check') {

    v.innerHTML = `<div class="screen">${head}<div class="rank">${top.map(([pid, sc], i) => `<div class="rk" style="animation-delay:${i * .12}s"><span class="pos">${i + 1}</span><span>${players[pid].a ? `<span class="rav">${esc(players[pid].a)}</span>` : ''}${esc(players[pid].n)}</span><span class="cl">${esc(S.names[players[pid].c])}</span><span class="pt">${sc}</span></div>`).join('')}</div></div>`;

    const nx = m.nextEn;

      <div class="kicker" style="margin-top:8px;display:flex;gap:40px">${S.names.map((n, i) => `<span><bdi class="en">${esc(n)}</bdi>: <bdi class="en">${tot[i]}</bdi></span>`).join('')}</div>
      ${nx ? `<div class="chip" style="margin-top:22px;font-size:28px">Qualifies for: ${esc(nx)}</div>` : ''}</div>`;

    const body = `${head}<div class="stem ${q.p.length > 150 ? 'long' : ''} ${st.gold ? 'gold' : ''}">${stemHtml(q)}</div>${optsHtml(st, reveal)}${reveal ? exHtml(q) + fastHtml(st) + fanStatHtml(st) : ''}${tilesHtml(st, reveal).replace('class="tiles"', 'class="tiles" id="tl"')}`;
    if (st.r.passage) v.innerHTML = `<div class="screen" style="justify-content:flex-start"><div class="pwrap"><div class="ptext">${st.r.passage.split(/\n\s*\n/).map((p) => `<p>${esc(p)}</p>`).join('')}</div><div class="pq ${reveal ? 'reveal' : ''}">${body}</div></div></div>`;
    else v.innerHTML = `<div class="screen ${reveal ? 'reveal' : ''}" style="justify-content:flex-start"><div class="qwrap">${body}</div></div>`;
    // the whole passage must be visible (no scrolling in class): shrink the text until it fits its box
    const pt = v.querySelector('.ptext'); if (pt) { let fs = 26; pt.style.fontSize = fs + 'px'; while (pt.scrollHeight > pt.clientHeight + 1 && fs > 12) pt.style.fontSize = (fs -= 1) + 'px'; }
    if (!reveal) {
      if (!S.qOpen || S.qOpen !== st.key) { S.qOpen = st.key; put('state', { phase: 'q', k: st.key, n: st.qi + 1, round: st.r.t, gold: st.gold ? 1 : 0, q: { p: q.p, o: q.o, u: q.u ? 1 : 0 }, dur: st.r.sec, st: { '.sv': 'timestamp' } }); if (st.gold) { sfx.gold(); say('golden', 500); } }
      startTimer(st.r.sec, () => window.reveal()); // the local «reveal» flag above shadows the function
    }
  }

}
async function reveal() {
  const st = S.steps[S.i];
  if (st.k !== 'q' || S.phase === 1) return;
  stopTimer(); S.phase = 1;
  const a = curAns(st), q = st.q, t0 = stateSrv && stateSrv.k === st.key && typeof stateSrv.st === 'number' ? stateSrv.st : null;
  const pts = {};
  for (const [pid, x] of Object.entries(a)) {
    if (!x || x.c !== q.a || !players[pid] || (away[st.key] || {})[pid]) continue; // left the page during the question = no points
    const el = t0 && typeof x.t === 'number' ? Math.max(0, (x.t - t0) / 1000) : st.r.sec / 2;
    pts[pid] = (st.r.base + Math.round(st.r.bonus * Math.max(0, 1 - el / st.r.sec))) * (st.gold ? 2 : 1);
  }
  const fresh = !S.hist[st.key], before = teamTotals();
  if (fresh) {
    S.streak = S.streak || {};
    for (const pid of Object.keys(players)) S.streak[pid] = pts[pid] ? (S.streak[pid] || 0) + 1 : 0;
    const fast = Object.keys(pts).sort((x, y) => (a[x].t || 9e15) - (a[y].t || 9e15))[0];
    S.hist[st.key] = { pts, fast: fast || null };
    for (const [pid, p] of Object.entries(pts)) S.scores[pid] = (S.scores[pid] || 0) + p;
  }
  put('state', { phase: 'reveal', k: st.key, n: st.qi + 1, round: st.r.t, q: { p: q.p, o: q.o, u: q.u ? 1 : 0 }, ans: q.a });
  const sc = {}; for (const pid of Object.keys(players)) sc[pid] = S.scores[pid] || 0;
  patch('scores', sc);
  show();
  // crowd reaction: how many of the players who answered got it right
  const answered = Object.keys(a).filter((pid) => players[pid]).length, right = Object.keys(pts).length, share = answered ? right / answered : 0;
  if (!fresh) sfx.ok();
  else if (!answered) sfx.buzz();
  else if (!right) { sfx.aww(); say('none', 900); }
  else if (share >= .5) { sfx.fanfare(); setTimeout(() => realApplause(1), 300); say('great', 700); }
  else { sfx.ok(); setTimeout(() => realApplause(.5), 300); if (Math.random() < .5) say('good', 600); }
  const after = teamTotals(), lead = (t) => { const m = Math.max(...t); return t.filter((x) => x === m).length > 1 ? -1 : t.indexOf(m); };
  if (fresh && lead(after) >= 0 && lead(after) !== lead(before) && Math.max(...before) > 0) setTimeout(() => { sfx.horn(); say('lead', 600); const e = $('#lead'); if (e) { e.textContent = `${S.names[lead(after)]} takes the lead!`; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2600); } }, 1300);
  S.names.forEach((_, i) => { const e = $('#sc' + i); if (e) { e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 260); } });
}
function next() {
  const st = S.steps[S.i];
  if (st.k === 'final' && S.official && !S.saved) return show();
  if (st.k === 'q' && S.phase === 0) return reveal();
  if (st.k === 'check') { const tot = teamTotals(), mx = Math.max(...tot); if (tot.filter((x) => x === mx).length === 1) { S.i = S.steps.findIndex((s) => s.k === 'final'); S.phase = 0; return show(); } }
  if (st.k === 'q' && st.tie) { const tot = teamTotals(), mx = Math.max(...tot); if (tot.filter((x) => x === mx).length === 1) { S.i = S.steps.findIndex((s) => s.k === 'final'); S.phase = 0; return show(); } }
  if (S.i < S.steps.length - 1) { S.i++; S.phase = 0; S.qOpen = null; show(); }
}
function prev() { if (S.i > 0) { S.i--; const p = S.steps[S.i]; S.phase = p.k === 'q' && S.hist[p.key] ? 1 : 0; S.qOpen = p.key; show(); } }
function confetti() { const c = $('#confetti'), x = c.getContext('2d'); const P = Array.from({ length: 220 }, () => ({ x: Math.random() * 1600, y: -Math.random() * 900, r: 5 + Math.random() * 7, c: ['#FFC93C', '#F08A24', '#22c55e', '#fff', '#0A7A4B'][Math.floor(Math.random() * 5)], v: 2 + Math.random() * 4, a: Math.random() * 6 })); let f = 0; (function loop() { x.clearRect(0, 0, 1600, 900); P.forEach((p) => { p.y += p.v; p.x += Math.sin((p.a += .05)) * 1.5; x.fillStyle = p.c; x.fillRect(p.x, p.y, p.r, p.r * .6); }); if (++f < 420) requestAnimationFrame(loop); else x.clearRect(0, 0, 1600, 900); })(); }
addEventListener('keydown', (e) => {
  if (!S || !$('#setup').hidden) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'PageDown' || k === ' ' || k === 'Enter' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowRight' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'b' || k === 'B' || k === '.') $('#black').hidden = !$('#black').hidden;
  else if ((k === 'f' || k === 'F') && S) { S.gate = S.gate === 'fans' ? 'players' : 'fans'; patch('info', { gate: S.gate }); save(); if (S.steps[S.i].k === 'lobby') renderLobby(); $('#net').style.color = '#fbbf24'; $('#net').textContent = S.gate === 'fans' ? '👥 Fans can join now (F)' : '⚽ Players can join now (F)'; }
  else if (k === 'm' || k === 'M') { MUTE = !MUTE; $('#net').style.color = '#fbbf24'; $('#net').textContent = MUTE ? '🔇 Sound off (M)' : ''; }
  else if (k === 'Escape') { stopTimer(); $('#setup').hidden = false; if ($('#mini')) $('#mini').hidden = true; setupInit(); }
});
$('#stage').addEventListener('click', (e) => { if (!S || !$('#setup').hidden || e.target.closest('#board') || e.target.closest('#mini')) return; next(); });
// small join code in the corner for the whole match, so a student who closed the page can scan again and come back
function miniQr() {
  let el = $('#mini');
  if (!el) { el = document.createElement('div'); el.id = 'mini'; $('#stage').appendChild(el); }
  el.style.cssText = 'position:absolute;left:16px;top:16px;z-index:20;background:#fff;border-radius:12px;padding:6px 6px 4px;text-align:center;font:700 13px Inter,sans-serif;color:#0B3D2B';
  const join = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}play.html?r=${S.room}`;
  let img = ''; try { const qr = qrcode(0, 'M'); qr.addData(join); qr.make(); img = qr.createDataURL(4, 4); } catch (e) {}

}
$('#black').onclick = (e) => { e.stopPropagation(); $('#black').hidden = true; };
async function tryUnlock(pw, quiet) {
  try { await unlock(pw); } catch (e) { if (!quiet) $('#perr').textContent = 'كلمة السر غلط.'; return false; }
  try { sessionStorage.setItem('slpw', pw); } catch (e) {}

}
$('#unl').onclick = () => { const pw = $('#pw').value.trim(); if (!pw) { $('#perr').textContent = 'اكتب كلمة السر.'; return; } tryUnlock(pw); };
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#unl').click(); });
$('#pw').addEventListener('input', () => { $('#perr').textContent = ''; });
(() => { let pw = null; try { pw = sessionStorage.getItem('slpw'); } catch (e) {} if (pw) tryUnlock(pw, true); })();
